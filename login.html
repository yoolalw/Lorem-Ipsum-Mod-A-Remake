<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <input type="email" id="email" class="ml-3 h-[40px]" placeholder="email@example.com">

        <button type="button" id="btn_login" class="mt-10 bg-[#1c365e] h-[40px] w-[300px] rounded-xl font-serif

        <a href="recuperar_senha.html" class="mt-2 text-blue-400">Esqueci minha senha</a>

        <img src="img/info_151776.png" class="size-[30px] cursor-pointer mt-5" onclick="sobre()">
